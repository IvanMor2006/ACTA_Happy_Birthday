<div class="modal fade modal-bottom" id="am_ol" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered mt-auto">
        <form class="modal-content" method="post" action="{{ url_for('sp_ol.update_pay', ku=person.ku) }}">
            <div class="modal-header">
                <h5 class="modal-title">Пополнение баланса</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="nbrb-icon fs-4">BYN</i></span>
                    <input class="form-control" type="number" name="am_ol_sum" id="am_ol_sum" 
                    step="0.01" placeholder="7.00" required>
                </div>
                <div class="form-check">
                    <label class="form-check-label" for="am_ol_auto_debt">Автоматически закрывать долги</label>
                    <input class="form-check-input" type="checkbox" name="am_ol_auto_debt" id="am_ol_auto_debt" checked>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Подтвердить</button>
            </div>
        </form>
    </div>
</div>
