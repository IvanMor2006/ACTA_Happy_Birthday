<div class="modal fade modal-bottom" id="d_gift" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered mt-auto">
        <form class="modal-content" method="post" action="{{ url_for('sp_gift.delete', ku_ol=person.ku) }}">
            <input type="hidden" name="d_gift_ku" id="d_gift_ku">
            <div class="modal-header">
                <h5 class="modal-title">Точно удалить подарок "<span id="d_gift_naim"></span>"?</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="submit" class="btn btn-danger">Да</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Нет</button>
            </div>
        </form>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const dModal = document.getElementById('d_gift')
        if (dModal) {
            dModal.addEventListener('show.bs.modal', function(event) {
                const button = event.relatedTarget;

                const ku = button.getAttribute('data-ku');
                const naim = button.getAttribute('data-naim');

                document.getElementById('d_gift_ku').value = ku;
                document.getElementById('d_gift_naim').textContent = naim; 
            });
        }
    });
</script>
