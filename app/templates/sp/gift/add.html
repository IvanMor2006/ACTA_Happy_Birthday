<div class="modal fade modal-bottom" id="{{ modal_id }}" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered mt-auto">
        <form class="modal-content" method="post" action="{{ url_for('sp_gift.add', ku_ol=person.ku) }}" enctype="multipart/form-data">
            <div class="modal-header">
                <h5 class="modal-title">Добавление подарка</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label for="{{ modal_id }}_url">Ссылка</label>
                    <input class="form-control" type="url" name="{{ modal_id }}_url" id="{{ modal_id }}_url" required>
                </div>
                <div class="mb-2">
                    <label for="{{ modal_id }}_naim">Название</label>
                    <input class="form-control mb-2" type="text" name="{{ modal_id }}_naim" id="{{ modal_id }}_naim" required>
                </div>
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div class="w-100">
                        {% if user_role == 'admin' %}
                            <div class="mb-2">
                                <label for="{{ modal_id }}_status">Статус</label>
                                <select class="form-select" name="{{ modal_id }}_status" id="{{ modal_id }}_status" required>
                                {% for status in gift_statuses %}
                                <option value="{{ status.status }}">
                                    {{ status.status }}
                                </option>
                                {% endfor %}
                                </select>
                            </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="{{ modal_id }}_cost">Стоимость</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="nbrb-icon fs-4">BYN</i></span>
                                <input class="form-control" type="number" name="{{ modal_id }}_cost" id="{{ modal_id }}_cost" 
                                step="0.01" min="0.01">
                            </div>
                        </div>
                        <div>
                            <label for="{{ modal_id }}_img" class="btn border w-100">
                                <i class="bi bi-image me-2"></i> Выберите изображение
                            </label>
                            <input class="d-none" type="file" accept="image/*" name="{{ modal_id }}_img" id="{{ modal_id }}_img">
                        </div>
                    </div>
                    <div id="{{ modal_id }}_img_preview" class="mt-4 card gift-card col-6 position-relative overflow-hidden d-none"></div>
                </div>
                <script>
                    const img_input = document.getElementById('{{ modal_id }}_img');
                    const img_preview = document.getElementById('{{ modal_id }}_img_preview');
                    const img_label = document.getElementById('{{ modal_id }}_img_label');
                    const modal = document.getElementById('{{ modal_id }}');

                    function showImgPrewiew(file) {
                        if (file && file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                img_preview.style.backgroundImage = `url(${e.target.result})`;
                                img_preview.classList.remove('d-none');
                                img_label.classList.add('d-none');
                            }
                            reader.readAsDataURL(file);
                        } else {
                            img_preview.classList.add('d-none');
                            img_label.classList.remove('d-none');
                            img_preview.style.backgroundImage = 'none';
                            img_input.value = '';
                        }
                    }

                    img_input.addEventListener('change', function() {
                        showImgPrewiew(this.files[0]);
                    });

                    modal.addEventListener('paste', function(e) {
                        const items = (e.clipboardData || e.originalEvent.clipboardData).items;

                        for (let i = 0; i < items.length; i++) {
                            if (items[i].type.indexOf('image') !== -1) {
                                const file = items[i].getAsFile();
                                const dataTransfer = new DataTransfer();
                                dataTransfer.items.add(file);
                                img_input.files = dataTransfer.files;

                                showImgPrewiew(file);
                                e.preventDefault();
                                break;
                            }
                        }
                    });
                </script>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Подтвердить</button>
            </div>
        </form>
    </div>
</div>
